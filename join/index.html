<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page_title">RayTok 연결</title>
<style>
  body { font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; margin: 0; padding: 32px 20px; color: #0A0F1F; background: #f3f2f2; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.5; color: #444; }
  a.btn { display: block; text-align: center; padding: 14px; border-radius: 12px; background: #0A0F1F; color: #fff; text-decoration: none; font-weight: 600; margin-top: 16px; }
  a.btn.secondary { background: #fff; color: #0A0F1F; border: 1px solid #ccc; }
  .hint { font-size: 13px; color: #777; margin-top: 24px; line-height: 1.5; }
</style>
</head>
<body>
<h1 data-i18n="heading">RayTok 투폰 연결</h1>
<p id="msg" data-i18n="msg_opening">앱을 여는 중입니다…</p>
<a class="btn" id="open" href="#" data-i18n="btn_open">앱으로 열기</a>
<a class="btn" id="web-listen" href="#" style="display:none; background:#0284c7; margin-top:10px;" data-i18n="btn_web_listen">브라우저로 듣기</a>
<a class="btn secondary" id="store" href="/download/" data-i18n="btn_install">앱이 없으면 설치하기</a>
<p class="hint"><span data-i18n="hint_1">상대 폰의 RayTok 화면에 뜬 QR을 찍으면 이 페이지로 옵니다. 앱이 깔려 있으면 바로 열리고, 없으면 위 단추로 설치한 뒤 QR을 다시 찍으세요.</span><br><span data-i18n="hint_2">같은 Wi-Fi(또는 한쪽 핫스팟)에 있어야 연결됩니다. 인터넷은 필요 없습니다.</span><br><span data-i18n="hint_3">주소창에 실린 연결 정보는 그 폰의 집 안 주소와 그때만 쓰는 확인 코드입니다. 상대가 같은 Wi-Fi에 있지 않으면 아무 의미가 없고, 호스트가 화면을 닫으면 곧바로 못 쓰게 됩니다.</span></p>
<script>
// 손님 글자 — ./ui-strings.json (web/listener 과 같은 모양, 81개 언어). 순서: ?lang= → navigator.language → ko.
// 사전을 못 받아도 페이지는 한국어 그대로 돈다 (아래 본문이 ko 원문이다).
var RT_I18N = { dict: null, lang: 'ko' };
function rtNorm(code) {
  var l = String(code || '').trim().toLowerCase();
  if (!l) return '';
  if (l.indexOf('zh') === 0) return 'zh';
  if (l === 'tl' || l.indexOf('tl-') === 0 || l === 'fil' || l.indexOf('fil-') === 0) return 'fil';
  if (l === 'in' || l.indexOf('in-') === 0) return 'id';
  if (l === 'iw' || l.indexOf('iw-') === 0) return 'he';
  if (l === 'nb' || l === 'no' || l.indexOf('no-') === 0 || l === 'nn') return 'nb';
  return l.split('-')[0];
}
function rtT(key, lang) {
  var d = RT_I18N.dict; if (!d || !d.strings || !d.strings[key]) return '';
  var it = d.strings[key]; return it[lang || RT_I18N.lang] || it.en || it.ko || '';
}
function rtApply(lang) {
  RT_I18N.lang = lang;
  document.documentElement.lang = lang;
  document.documentElement.setAttribute('dir', /^(ar|he|fa|ur)$/.test(lang) ? 'rtl' : 'ltr');
  var els = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < els.length; i++) { var v = rtT(els[i].getAttribute('data-i18n'), lang); if (v) els[i].textContent = v; }
}
function rtLoadStrings(qLang) {
  var want = rtNorm(qLang) || rtNorm(navigator.language) || 'ko';
  /* B 19 — 81개 언어 사전을 통째로 받지 않는다(116 KB · gz 46 KB). 쓸 언어 **한 조각**만
     받는다(약 4 KB · gz 1.8 KB). 조각은 `tools/split-ui-strings.js` 가 손 표에서 만든다.
     조각이 없으면(모르는 언어·옛 배포) 통째로 한 번 더 — 그래도 없으면 이 페이지는
     마크업의 한국어 그대로 돈다(아래 본문이 ko 원문이다). */
  return fetch('./ui-strings/' + encodeURIComponent(want) + '.json').then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (d) {
    if (d && d.strings) { RT_I18N.dict = d; rtApply(want); return null; }
    return fetch('./ui-strings.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (full) {
      if (!full || !full.langs) return;
      RT_I18N.dict = full;
      rtApply(full.langs.indexOf(want) >= 0 ? want : 'ko');
    });
  }).catch(function () {});
}
</script>
<script>
(function () {
  // 초대는 질의(?ip=…&code=…&name=…&lang=…&pkg=…)에 실린다 — App Links가
  // 앱에 그대로 넘기는 형태다. 조각(#)으로 만든 옛 QR도 계속 읽는다.
  var q = {};
  var src = (location.search || '').replace(/^\?/, '') || (location.hash || '').replace(/^#/, '');
  src.split('&').forEach(function (p) {
    var i = p.indexOf('='); if (i < 0) return;
    try { q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1)); } catch (e) {}
  });
  var pkg = q.pkg || 'com.raytok.ear';
  // 스토어에는 아직 없다 (D-06 — 변리사 검토 전 공개 금지). 그 주소는 404이므로
  // 설치는 우리 페이지로 보낸다. 등록되면 이 한 줄만 스토어 주소로 되돌린다.
  var store = 'https://raytok.kr/download/';
  var ok = /^\d{1,3}(\.\d{1,3}){3}$/.test(q.ip || '') && /^[A-Z0-9]{6}$/i.test(q.code || '');
  var qs = 'ip=' + encodeURIComponent(q.ip || '') + '&code=' + encodeURIComponent((q.code || '').toUpperCase())
         + '&name=' + encodeURIComponent(q.name || '') + '&lang=' + encodeURIComponent(q.lang || '')
         + (q.mode === 'guide' ? '&mode=guide' : '');   // v2 가이드 세션 QR (D-138)
  var intent = 'intent://join?' + qs + '#Intent;scheme=raytok;package=' + pkg
             + ';S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
  var deep = 'raytok://join?' + qs;
  document.getElementById('store').href = store;
  // 글자 사전을 먼저 받고(없어도 간다) 안내 글을 그 언어로 적는다 — 머리글·단추는 data-i18n 이 맡는다.
  var done = rtLoadStrings(q.lang);
  var msgEl = document.getElementById('msg');
  var setMsg = function (key, koText) { done.then(function () { msgEl.textContent = rtT(key) || koText; }); };
  // 6번: QR에 room= 칸이 있으면 「브라우저로 듣기」 단추 노출 (앱 없으면 웹 청취로)
  var room = q.room || '';
  if (room && /^[A-Z0-9]{6}$/i.test(room)) {
    var webListenBtn = document.getElementById('web-listen');
    if (webListenBtn) {
      var listenerUrl = '/web/listener/?room=' + encodeURIComponent(room.toUpperCase())
                      + (q.lang ? '&lang=' + encodeURIComponent(q.lang) : '');
      webListenBtn.href = listenerUrl;
      webListenBtn.style.display = 'block';
    }
  }

  if (!ok) {
    setMsg('msg_no_info', '연결 정보가 없는 링크입니다. 상대 화면의 QR을 다시 찍어 주세요.');
    document.getElementById('open').style.display = 'none';
    return;
  }
  var android = /Android/i.test(navigator.userAgent);
  document.getElementById('open').href = android ? intent : deep;
  if (android) setMsg('msg_android', '앱이 있으면 바로 열립니다. 열리지 않으면 아래 단추를 누르세요.');
  else setMsg('msg_ios', '이 링크는 안드로이드 RayTok 앱용입니다. 아이폰용 앱은 아직 없습니다.');
  if (android) { setTimeout(function () { location.href = intent; }, 300); }
})();
</script>
</body>
</html>
