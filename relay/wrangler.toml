name = "raytok-relay"
main = "src/index.js"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[vars]
LICENSE_MAX_DEVICES = "1"
# B 3 — 방(DO)이 같은 릴레이의 /translate 를 부를 주소. 같은 엔진·같은 상한·같은 글자 세기를
# 쓰기 위해 엔진을 따로 부르지 않는다. 비우면 방은 번역하지 않고 no_tr 을 보낸다(§20: 조용히 넘기지 않는다).
RELAY_BASE_URL = "https://raytok-relay.raytok.workers.dev"
# 방 번역 스위치. 기본 켬(§24) — 끄려면 "0".
ROOM_TR = "1"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 리드(상담 신청) 저장소 — 2026-10-31 추가
# 쓰기 전에 KV 네임스페이스를 한 번 만들어야 한다:
#   npx wrangler kv namespace create LEADS
# (완료 2026-10-31 — 아래 id 기입됨)
# 조회용 토큰은 코드·설정 파일에 적지 않는다. 비밀로 넣는다:
#   npx wrangler secret put LEAD_ADMIN_TOKEN
# KV 가 없으면 /lead 와 /contact 는 503 을 돌려준다. 조용히 삼키지 않는다.
[[kv_namespaces]]
binding = "LEADS"
id = "f0d6d702348942cab778cbbec1c33b15"

# ── 부하 시험용 릴레이 (NOW 11-01 13:47 · GS인증 「동시 청취자 수」) ──────────────────
# 운영(raytok-relay)과 **이름·Durable Object 저장이 따로**다. 운영 비밀값은 쓰지 않는다.
# 배포(대표님 손):  npx wrangler deploy --env loadtest
# 비밀값 둘(아무 난수 — 운영 값을 넣지 않는다):
#   npx wrangler secret put LICENSE_SECRET --env loadtest
#   npx wrangler secret put LICENSE_SALT   --env loadtest
# 시험 키 0번 코드만 받는다(ALLOW_TEST_KEY=1). 방 번역은 끈다(ROOM_TR=0 — 구글 요금이 안 나가게,
# 재는 것은 방의 퍼뜨리기다). LEADS(KV)는 붙이지 않는다 — /lead·/contact 는 여기서 503 이 맞다.
# 다 쓰면 지운다:  npx wrangler delete --env loadtest
[env.loadtest]
name = "raytok-relay-loadtest"

[env.loadtest.vars]
LICENSE_MAX_DEVICES = "1"
RELAY_BASE_URL = ""
ROOM_TR = "0"
ALLOW_TEST_KEY = "1"

[env.loadtest.durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" }
]
