<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>RayTok Web Console</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #38bdf8;
        --primary-hover: #0ea5e9;
        --success: #34d399;
        --danger: #f87171;
        --warning: #fbbf24;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      color-scheme: dark;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 100;
      background: var(--card-bg);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: max(16px, env(safe-area-inset-top, 0px));
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .brand {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .view-container {
      display: none;
    }
    .view-container.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text);
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.95rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn.secondary:hover { background: var(--border); }
    .btn.danger { background: var(--danger); }
    .btn.success { background: var(--success); }

    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin: 10px 0;
    }
    .keypad-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 0;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }
    .keypad-btn:hover { background: var(--primary); color: #fff; }
    .keypad-btn.wide { grid-column: span 3; }

    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .script-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 16px;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .script-line {
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .script-line.current {
      background: rgba(2, 132, 199, 0.15);
      border-left: 4px solid var(--primary);
      font-weight: 600;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .status-badge.live { background: rgba(16, 185, 129, 0.15); color: var(--success); }
    .status-badge.paused { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>RayTok Web Console</span>
      <span class="status-badge live" id="sys-status">● Live Demo</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('host')">강사 화면 (Host)</button>
      <button class="tab-btn" onclick="switchView('listener')">청취자 화면 (Listener)</button>
    </div>
  </header>

  <main>
    <!-- HOST VIEW -->
    <div id="view-host" class="view-container active">
      <div class="card" id="host-auth-card">
        <h2>1. 강사 이용권 인증</h2>
        <input type="text" id="host-token" placeholder="이용권 코드 입력 (예: valid_test_token)" value="valid_test_token">
        <button class="btn" onclick="hostLogin()">인증하고 시작하기</button>
      </div>

      <div class="card" id="host-live-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2>강의 진행 (세션 코드: <strong id="host-room-code" style="color: var(--primary);">ABC123</strong>)</h2>
          <div>
            <span class="status-badge paused" id="play-status-badge">■ 정지됨</span>
            <span style="font-weight: bold; margin-left: 10px;" id="live-progress-text">0 / 3</span>
          </div>
        </div>

        <div class="script-box" id="host-script-list">
          <!-- Populated dynamically -->
        </div>

        <div class="controls-row">
          <button class="btn secondary" onclick="doPrev()">◀ 이전</button>
          <button class="btn" id="btn-play-toggle" onclick="togglePlay()">▶ 재생</button>
          <button class="btn secondary" onclick="doNext()">다음 ▶</button>
          <button class="btn secondary" onclick="toggleBreak()" id="btn-break">⏸ 쉬는 시간</button>
          <button class="btn danger" onclick="endLecture()">끝내기</button>
        </div>

        <div style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px;">
          <h3>🎤 음성 답변 및 Q&A 대기열</h3>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px;">청취자가 손을 들면 아래에 표시되며, 음성으로 답변할 수 있습니다.</p>
          <div style="background: var(--bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); min-height: 60px;" id="host-ask-queue">
            <span style="color: var(--text-muted); font-size: 0.9rem;">대기 중인 질문이 없습니다.</span>
          </div>
          <div class="controls-row" style="margin-top: 10px;">
            <button class="btn secondary" onclick="answerWithMic()">🎤 음성 답변 시작</button>
          </div>
        </div>
      </div>
    </div>

    <!-- LISTENER VIEW -->
    <div id="view-listener" class="view-container">
      <div class="card" id="listener-join-card">
        <h2>청취자 세션 참여</h2>
        <label>세션 코드 (A-Z, 0-9)</label>
        <input type="text" id="room-input" placeholder="ABC123" maxlength="6" style="text-transform: uppercase; font-size: 1.2rem; font-weight: bold; text-align: center; letter-spacing: 2px;">

        <!-- On-screen touch keypad -->
        <div class="keypad-grid" id="on-screen-keypad"></div>

        <label style="margin-top: 12px; display: block;">내 언어 선택</label>
        <select id="listener-lang">
          <option value="ko">한국어 (Korean)</option>
          <option value="en">English (영어)</option>
          <option value="ja">日本語 (일본어)</option>
          <option value="zh">中文 (중국어)</option>
          <option value="vi">Tiếng Việt (베트남어)</option>
        </select>

        <label style="margin-top: 12px; display: block;">이름 (선택)</label>
        <input type="text" id="listener-name" placeholder="홍길동">

        <button class="btn" style="width: 100%; margin-top: 12px;" onclick="listenerJoin()">참여하기</button>
      </div>

      <div class="card" id="listener-live-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 id="listener-room-title">방 연결됨: ABC123</h2>
          <button class="btn secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="toggleTts()" id="btn-tts">🔊 소리 켜짐</button>
        </div>

        <div class="script-box" id="listener-display" style="min-height: 180px; font-size: 1.15rem; font-weight: 500;">
          강사가 강의를 시작하면 여기에 실시간 번역문이 표시됩니다...
        </div>

        <div class="controls-row" style="justify-content: space-between;">
          <button class="btn secondary" onclick="openAskModal()">✋ 음성 질문하기</button>
          <button class="btn secondary" onclick="listenerLeave()">나가기</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Voice Ask Modal -->
  <div id="ask-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div class="card" style="width: 320px; max-width: 90vw; text-align: center;">
      <h3>🎤 음성 질문하기</h3>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 10px 0;" id="ask-modal-status">마이크에 대고 말씀하세요...</p>
      <div style="background: var(--bg); padding: 12px; border-radius: 8px; min-height: 60px; margin-bottom: 16px; font-size: 1rem;" id="ask-transcript">
        (음성 인식 대기 중)
      </div>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn secondary" onclick="closeAskModal()">취소</button>
        <button class="btn success" onclick="submitVoiceQuestion()">음성 전송</button>
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    function switchView(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
      if (tab === 'host') {
        document.querySelector('.nav-tabs button:nth-child(1)').classList.add('active');
        document.getElementById('view-host').classList.add('active');
      } else {
        document.querySelector('.nav-tabs button:nth-child(2)').classList.add('active');
        document.getElementById('view-listener').classList.add('active');
      }
    }

    // Host state
    let hostState = {
      on: false,
      cur: 0,
      playing: false,
      timer: null,
      breakOn: false,
      pausedAt: 0,
      paragraphs: [
        { src: "안녕하세요 여러분, 오늘 RayTok 세션에 오신 것을 환영합니다." },
        { src: "본 시스템은 80개 언어 실시간 동시통역과 음성 인식 Q&A를 지원합니다." },
        { src: "재생, 일시정지, 쉬는 시간 기능으로 강의를 완벽하게 제어할 수 있습니다." }
      ]
    };

    function hostLogin() {
      document.getElementById('host-auth-card').style.display = 'none';
      document.getElementById('host-live-card').style.display = 'block';
      renderHostScript();
    }

    function renderHostScript() {
      const container = document.getElementById('host-script-list');
      container.innerHTML = '';
      hostState.paragraphs.forEach((p, i) => {
        const idx = i + 1;
        const div = document.createElement('div');
        div.className = `script-line ${idx === hostState.cur ? 'current' : ''}`;
        div.textContent = `${idx}. ${p.src}`;
        container.appendChild(div);
      });
      document.getElementById('live-progress-text').textContent = `${hostState.cur} / ${hostState.paragraphs.length}`;
    }

    function goTo(n) {
      if (n < 1 || n > hostState.paragraphs.length) return;
      hostState.cur = n;
      renderHostScript();
      updateListenerDisplay(hostState.paragraphs[n - 1].src);
    }

    function doNext() {
      if (hostState.cur < hostState.paragraphs.length) {
        goTo(hostState.cur + 1);
        if (hostState.playing) armPlay();
      }
    }

    function doPrev() {
      if (hostState.cur > 1) {
        goTo(hostState.cur - 1);
        if (hostState.playing) armPlay();
      }
    }

    function togglePlay() {
      if (hostState.playing) {
        stopPlay('btn');
      } else {
        startPlay('btn');
      }
    }

    function startPlay(why) {
      const resume = hostState.pausedAt >= 1 ? hostState.pausedAt : (hostState.cur >= 1 ? hostState.cur : 1);
      hostState.playing = true;
      hostState.pausedAt = 0;
      document.getElementById('btn-play-toggle').textContent = '■ 멈춤';
      document.getElementById('play-status-badge').textContent = '▶ 재생 중';
      document.getElementById('play-status-badge').className = 'status-badge live';
      goTo(resume);
      armPlay();
    }

    function stopPlay(why) {
      if (hostState.timer) { clearTimeout(hostState.timer); hostState.timer = null; }
      hostState.playing = false;
      if (why !== 'end' && hostState.cur >= 1) {
        hostState.pausedAt = hostState.cur;
      }
      document.getElementById('btn-play-toggle').textContent = '▶ 재생';
      document.getElementById('play-status-badge').textContent = '■ 정지됨 (pausedAt=' + hostState.pausedAt + ')';
      document.getElementById('play-status-badge').className = 'status-badge paused';
    }

    function armPlay() {
      if (hostState.timer) clearTimeout(hostState.timer);
      if (!hostState.playing) return;
      const ms = 4000; // 4 seconds per paragraph for demo
      hostState.timer = setTimeout(() => {
        if (!hostState.playing) return;
        if (hostState.cur < hostState.paragraphs.length) {
          goTo(hostState.cur + 1);
          armPlay();
        } else {
          stopPlay('end');
        }
      }, ms);
    }

    function toggleBreak() {
      hostState.breakOn = !hostState.breakOn;
      const btn = document.getElementById('btn-break');
      if (hostState.breakOn) {
        stopPlay('break');
        btn.textContent = '⏸ 쉬는 시간 끝';
        btn.classList.add('danger');
        updateListenerDisplay('⏸ 쉬는 시간입니다.');
      } else {
        btn.textContent = '⏸ 쉬는 시간';
        btn.classList.remove('danger');
        if (hostState.pausedAt) startPlay('break_end');
      }
    }

    function endLecture() {
      stopPlay('end');
      alert('강의가 종료되었습니다.');
      hostLogin();
    }

    // Listener keypad setup
    const keypad = document.getElementById('on-screen-keypad');
    const roomInput = document.getElementById('room-input');
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789⌫'.split('');
    chars.forEach(c => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'keypad-btn' + (c === '⌫' ? ' wide' : '');
      btn.textContent = c;
      btn.onclick = () => {
        let v = roomInput.value || '';
        if (c === '⌫') {
          roomInput.value = v.slice(0, -1);
        } else if (v.length < 6) {
          roomInput.value = (v + c).toUpperCase();
        }
        roomInput.focus();
      };
      keypad.appendChild(btn);
    });

    function listenerJoin() {
      const code = roomInput.value.trim();
      if (!code) {
        alert('세션 코드를 입력하세요.');
        return;
      }
      document.getElementById('listener-join-card').style.display = 'none';
      document.getElementById('listener-live-card').style.display = 'block';
      document.getElementById('listener-room-title').textContent = `방 연결됨: ${code}`;
    }

    function listenerLeave() {
      document.getElementById('listener-live-card').style.display = 'none';
      document.getElementById('listener-join-card').style.display = 'block';
    }

    function updateListenerDisplay(text) {
      const disp = document.getElementById('listener-display');
      if (disp) {
        disp.textContent = text;
        // Speech synthesis if TTS enabled
        if (ttsOn && window.speechSynthesis) {
          const u = new SpeechSynthesisUtterance(text);
          window.speechSynthesis.speak(u);
        }
      }
    }

    let ttsOn = true;
    function toggleTts() {
      ttsOn = !ttsOn;
      document.getElementById('btn-tts').textContent = ttsOn ? '🔊 소리 켜짐' : '🔇 무음';
    }

    function openAskModal() {
      document.getElementById('ask-modal').style.display = 'flex';
      document.getElementById('ask-transcript').textContent = '마이크에 말씀하세요: "질문 있습니다!"';
    }

    function closeAskModal() {
      document.getElementById('ask-modal').style.display = 'none';
    }

    function submitVoiceQuestion() {
      alert('음성 질문이 강사에게 전송되었습니다.');
      closeAskModal();
      // Simulate queue item on host side
      const qContainer = document.getElementById('host-ask-queue');
      qContainer.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;">
        <span>1. 홍길동 (한국어) — "질문 있습니다!"</span>
        <button class="btn" style="padding:2px 8px; font-size:0.8rem;" onclick="alert('음성 답변 전송됨')">🎤 음성 답변</button>
      </div>`;
    }

    function answerWithMic() {
      alert('강사 마이크 답변 음성 인식 중...');
    }
  </script>
</body>
</html>
