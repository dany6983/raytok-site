<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RayTok 기록 해시 체인 검증</title>
  <link rel="stylesheet" href="/common/theme.css">
  <style>
    :root {
      /* 줄 20 디자인 체계 동기화 */
      --font-xs: 11px;
      --font-sm: 13px;
      --font-md: 15px;
      --font-lg: 17px;
      --font-xl: 22px;
      --font-hero: 30px;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 12px;
      --sp-lg: 16px;
      --sp-xl: 24px;
      --ink-high: #ffffff;
      --ink-mid: rgba(255, 255, 255, 0.5);
      --ink-low: rgba(255, 255, 255, 0.45);

      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: var(--sp-xl) var(--sp-md);
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
    p.desc { color: var(--text-muted); text-align: center; margin-bottom: 24px; font-size: 14px; }
    
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background-color: var(--card-bg);
      cursor: pointer;
      transition: border-color 0.2s;
      margin-bottom: 24px;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); }
    .drop-zone-text { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .drop-zone-sub { font-size: 13px; color: var(--text-muted); }

    .result-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: none;
    }
    .result-header { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .result-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
    }
    .badge-success { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-danger { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
    
    .result-details { font-size: 14px; line-height: 1.7; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .detail-label { color: var(--text-muted); }
    .detail-value { font-weight: 500; word-break: break-all; text-align: right; max-width: 70%; }
    
    .gap-box {
      margin-top: 16px;
      background-color: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #fbbf24;
      font-size: 13px;
    }
    .gap-title { font-weight: 700; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>RayTok 기록 해시 체인 검증</h1>
    <p class="desc">JSON 파일을 드래그 앤 드롭하거나 클릭하여 해시 체인의 무결성을 확인합니다.</p>
    
    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-text">기록 파일 드래그 또는 클릭</div>
      <div class="drop-zone-sub">RayTok 세션 기록 (.json) 파일만 지원됩니다.</div>
      <input type="file" id="file-input" style="display: none;" accept=".json">
    </div>

    <div class="result-card" id="result-card">
      <div class="result-header">
        검증 결과: 
        <span class="result-badge" id="result-badge"></span>
      </div>
      <p id="result-msg" style="font-size: 15px;"></p>
      
      <div class="result-details" id="result-details">
        <div class="detail-row">
          <span class="detail-label">세션 코드</span>
          <span class="detail-value" id="val-code">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">호스트 디바이스</span>
          <span class="detail-value" id="val-host">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">총 항목 수</span>
          <span class="detail-value" id="val-items">-</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">마지막 해시(last)</span>
          <span class="detail-value" id="val-last">-</span>
        </div>
      </div>

      <div class="gap-box" id="gap-box" style="display: none;">
        <div class="gap-title">⚠️ 데이터 누락 구간 감지 (gap 존재)</div>
        <div id="gap-list"></div>
      </div>
    </div>
  </div>

  <footer style="margin-top: 36px; padding: 16px 0; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); text-align: center;">
    <a href="/privacy/" style="color: var(--text-muted); text-decoration: none; margin-right: 14px;">개인정보 처리방침</a>
    <a href="/web/terms/" style="color: var(--text-muted); text-decoration: none;">이용약관</a>
  </footer>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const resultCard = document.getElementById('result-card');
    const resultBadge = document.getElementById('result-badge');
    const resultMsg = document.getElementById('result-msg');
    const gapBox = document.getElementById('gap-box');
    const gapList = document.getElementById('gap-list');

    // 세부 항목들
    const valCode = document.getElementById('val-code');
    const valHost = document.getElementById('val-host');
    const valItems = document.getElementById('val-items');
    const valLast = document.getElementById('val-last');

    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        handleFile(fileInput.files[0]);
      }
    });

    // Desk 뷰어 연동: sessionStorage에 검증 대상 세션이 있으면 자동 검증 실행
    try {
      const pendingPayload = sessionStorage.getItem('verify_payload');
      if (pendingPayload) {
        sessionStorage.removeItem('verify_payload');
        const parsed = JSON.parse(pendingPayload);
        verifyAndShow(parsed);
      }
    } catch (_) {}

    function handleFile(file) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          await verifyAndShow(parsed);
        } catch (err) {
          showError('JSON 파싱 실패: 올바른 JSON 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    function sortKeysDeep(obj) {
      if (obj === null || typeof obj !== 'object') return obj;
      if (Array.isArray(obj)) return obj.map(sortKeysDeep);
      
      const sortedKeys = Object.keys(obj).sort();
      const sortedObj = {};
      for (const key of sortedKeys) {
        sortedObj[key] = sortKeysDeep(obj[key]);
      }
      return sortedObj;
    }

    function normalize(item) {
      const copy = { ...item };
      delete copy.hash;
      return JSON.stringify(sortKeysDeep(copy));
    }

    async function sha256(str) {
      const msgBuffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verifyAndShow(data) {
      resultCard.style.display = 'block';
      gapBox.style.display = 'none';
      
      if (!data || typeof data !== 'object' || data.ver !== 1) {
        showError('실패 - 올바른 RayTok v1 기록 규격이 아닙니다.');
        return;
      }

      const items = data.items || [];
      if (items.length === 0) {
        showError('실패 - 검증할 항목(items)이 비어 있습니다.');
        return;
      }

      // 1) n 불연속 검증
      for (let i = 0; i < items.length; i++) {
        const expectedN = i + 1;
        if (items[i].n !== expectedN) {
          showError(`실패 - n 불연속: ${expectedN} 없음 (현재 n=${items[i].n})`);
          return;
        }
      }

      // 2) items[0].prev 검증
      const zero64 = '0'.repeat(64);
      if (items[0].prev !== zero64) {
        showError('실패 - 첫 항목의 prev 값이 올바르지 않습니다.');
        return;
      }

      // 3) 해시 계산 및 검증
      let prevHash = zero64;
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.prev !== prevHash) {
          showError(`실패 - prev 불일치: n=${item.n}의 prev가 직전 hash와 다릅니다.`);
          return;
        }

        const normStr = normalize(item);
        const computedHash = await sha256(item.prev + '\n' + normStr);
        if (item.hash !== computedHash) {
          showError(`실패 - 해시 불일치: n=${item.n}의 hash 값이 계산된 값과 다릅니다.`);
          return;
        }
        prevHash = item.hash;
      }

      // 5) last 검증
      if (data.last !== prevHash) {
        showError('실패 - last 불일치: last 값이 마지막 항목의 hash와 다릅니다.');
        return;
      }

      // 통과 완료! 상세 표시
      resultBadge.className = 'result-badge badge-success';
      resultBadge.textContent = '통과';
      resultMsg.textContent = '기록의 무결성 검증을 완벽하게 통과했습니다.';
      resultMsg.style.color = 'var(--success)';

      valCode.textContent = data.session?.code || '-';
      valHost.textContent = data.session?.host || '-';
      valItems.textContent = `${items.length} 개`;
      valLast.textContent = data.last || '-';

      // Gap 분석
      const gaps = [];
      const gapFills = [];
      for (const item of items) {
        if (item.kind === 'gap') gaps.push(item);
        if (item.kind === 'gap_fill') gapFills.push(item);
      }

      const unfilled = gaps.filter(g => !gapFills.some(f => f.dev === g.dev && f.from === g.from && f.to === g.to));
      if (unfilled.length > 0) {
        gapBox.style.display = 'block';
        gapList.innerHTML = unfilled.map(g => `• 장치 ID: <b>${g.dev}</b>, 누락 구간: <b>${g.from} ~ ${g.to}</b>`).join('<br>');
      }
    }

    function showError(msg) {
      resultBadge.className = 'result-badge badge-danger';
      resultBadge.textContent = '실패';
      resultMsg.textContent = msg;
      resultMsg.style.color = 'var(--danger)';
      
      valCode.textContent = '-';
      valHost.textContent = '-';
      valItems.textContent = '-';
      valLast.textContent = '-';
    }
  </script>
</body>
</html>
