<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-i18n="page_title">RayTok 청취자</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #334155;
      --warning: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 9999px;
      background-color: #334155;
      font-weight: 500;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
    .status-dot.online { background-color: var(--success); }
    .status-dot.reconnecting { background-color: var(--warning); }
    .status-dot.offline { background-color: var(--danger); }

    .screen { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h2 { font-size: 18px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: #0f172a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:active { background-color: var(--primary-hover); }

    .notice {
      background-color: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    #chat-screen { display: none; padding: 0; }
    #chat-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg-line { max-width: 90%; align-self: flex-start; }
    .msg-bubble {
      background-color: var(--card-bg);
      padding: 10px 14px;
      border-radius: 12px;
      border-top-left-radius: 2px;
      border: 1px solid var(--border);
      font-size: 15px;
      word-break: break-all;
    }
    .msg-tr { color: var(--primary); font-weight: 500; margin-top: 4px; }
    .msg-src { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
      vertical-align: middle;
    }
    .badge-pending { background-color: var(--warning); color: #000; }
    .badge-via { background-color: #475569; color: #fff; }
    .badge-meeting { background-color: #0369a1; color: #e0f2fe; }
    .badge-me { background-color: #047857; color: #d1fae5; }
    [dir="rtl"] .msg-bubble {
      border-top-left-radius: 12px;
      border-top-right-radius: 2px;
    }
    [dir="rtl"] .badge {
      margin-left: 0;
      margin-right: 4px;
    }

    .tool-bar {
      padding: 10px 16px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .tool-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .tool-btn.active { border-color: var(--primary); color: var(--primary); }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-content {
      background-color: var(--card-bg);
      border-radius: 16px;
      width: 100%;
      max-width: 320px;
      padding: 24px;
      text-align: center;
    }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .summary-box {
      background-color: #0f172a;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.8;
    }

    /* ── 큰 화면 보기 (?view=screen) — 회의실 TV·빔. 원문과 고른 언어를 나란히, 최근 줄만 ── */
    .tool-btn-screen { display: none; }
    .view-screen.in-chat .header { display: none; }
    .view-screen #chat-screen { height: 100vh; overflow: hidden; }
    .view-screen #chat-list { overflow: hidden; justify-content: flex-end; padding: 4vh 4vw; gap: 3vh; }
    .view-screen #chat-list > .msg-line { max-width: 100%; align-self: stretch; opacity: 0.5; }
    .view-screen #chat-list > .msg-line:last-child { opacity: 1; }
    .view-screen #chat-list > .msg-line:nth-last-child(n+5) { display: none; }  /* 최근 4줄만 */
    .view-screen .msg-bubble {
      display: grid; grid-template-columns: 1fr 1fr; column-gap: 4vw; align-items: start;
      background: none; border: 0 !important; border-radius: 0; padding: 0; opacity: 1 !important;
      font-size: clamp(22px, 5.4vh, 68px); line-height: 1.3;
      word-break: keep-all; overflow-wrap: anywhere;
    }
    .view-screen .msg-text { color: var(--text-muted); font-style: normal !important; }
    .view-screen .msg-tr { margin-top: 0; font-size: inherit !important; color: var(--primary) !important; font-weight: 600; }
    .view-screen .msg-src, .view-screen .msg-tr .badge { display: none; }
    .view-screen .tool-bar { position: fixed; left: 0; right: 0; bottom: 0; transform: translateY(100%); transition: transform .2s; }
    .view-screen.show-tools .tool-bar { transform: none; }
    .view-screen .tool-btn-screen { display: inline-block; margin-left: auto; }
    @media (max-aspect-ratio: 1/1) {   /* 세로 화면: 위아래로 */
      .view-screen .msg-bubble { grid-template-columns: 1fr; row-gap: 0.6vh; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary)"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      <span data-i18n="header_title">RayTok 청취자</span>
    </div>
    <div class="status-badge" id="status-badge">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text" data-i18n="status_ready">준비</span>
    </div>
  </div>

  <div class="screen" id="join-screen">

      <input type="text" id="room-input" placeholder="000000" maxlength="6" inputmode="numeric" data-i18n="room_code_placeholder">

      <div style="font-size: 13px; color: var(--warning); margin-bottom: 8px;" data-i18n="hint_keep_screen">화면을 켜 둔 채로 두세요</div>
      <label data-i18n="lang_select_label">언어 선택</label>
      <select id="lang-select">
        <option value="ko">한국어 (Korean)</option>
      </select>

      <label data-i18n="name_label">이름 (선택 사항)</label>
      <input type="text" id="name-input" placeholder="예: 홍길동" data-i18n="name_placeholder">

      <div class="notice">
        <div data-i18n="notice_code">• 세션 코드는 강사 화면의 번호를 입력하세요.</div>
        <div data-i18n="notice_sound">• 소리를 켜면 번역된 내용을 음성으로 들을 수 있습니다.</div>
      </div>

      <button class="btn" id="btn-join" data-i18n="join_button">참여하기</button>
    </div>
    <div style="text-align: center; color: var(--text-muted); font-size: 12px;">
      v<span id="ver-text">1.1.0</span> &copy; RayTok <!-- v1.1.0 -->
    </div>
  </div>

  <div class="screen" id="chat-screen">
    <div id="chat-list"></div>
    <div class="tool-bar">
      <span style="font-size: 13px; color: var(--text-muted);" id="current-lang-text"></span>
      <button class="tool-btn" id="btn-toggle-tts" data-i18n="tts_on">🔊 소리 켜짐</button>
      <button class="tool-btn tool-btn-screen" id="btn-fullscreen" aria-label="fullscreen">⛶</button>
    </div>
  </div>

  <!-- 세션 종료 모달 -->
  <div class="modal" id="end-modal">
    <div class="modal-content">
      <div class="modal-title" data-i18n="end_title">세션·안내 종료</div>
      <p style="color: var(--text-muted); font-size: 14px;" data-i18n="end_desc">세션이 정상적으로 종료되었습니다.</p>
      <div class="summary-box" id="end-summary">
        • <span data-i18n="summary_total_lines">총 세션 라인</span>: <b id="sum-lines">0</b>
        <span data-i18n="summary_lines_unit">줄</span><br>
        • <span data-i18n="summary_duration">진행 시간</span>: <b id="sum-minutes">0</b>
        <span data-i18n="summary_minutes_unit">분</span>
        <div id="sum-joined-row" style="display:none">
          • <span data-i18n="summary_max_joined">최대 동시 참여</span>: <b id="sum-joined">0</b>
          <span data-i18n="summary_joined_unit">명</span>
        </div>
      </div>
      <button class="btn" onclick="location.reload()" data-i18n="reload_button">새로고침</button>
    </div>
  </div>

  <!-- 숨겨진 i18n 템플릿/참조 항목 -->

    async function requestWakeLock() {
      if ('wakeLock' in navigator && navigator.wakeLock) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', function() {
            wakeLock = null;
          });
        } catch (e) {
          wakeLock = null;
        }
      }
    }

    function playNoSleepVideo() {
      if (!noSleepVideo) {
        noSleepVideo = document.createElement('video');
        noSleepVideo.setAttribute('loop', '');
        noSleepVideo.setAttribute('muted', '');
        noSleepVideo.muted = true;
        noSleepVideo.setAttribute('playsinline', '');
        noSleepVideo.style.position = 'fixed';
        noSleepVideo.style.left = '-9999px';
        noSleepVideo.style.width = '1px';
        noSleepVideo.style.height = '1px';
        noSleepVideo.style.opacity = '0';
        noSleepVideo.src = NO_SLEEP_VIDEO_URI;
        document.body.appendChild(noSleepVideo);
      }
      try {
        var p = noSleepVideo.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function(e) {});
        }
      } catch (e) {}
    }

    async function keepAwake() {
      isSessionActive = true;
      if ('wakeLock' in navigator && navigator.wakeLock) {
        await requestWakeLock();
      } else {
        playNoSleepVideo();
      }
    }

    function releaseWake() {
      isSessionActive = false;
      if (wakeLock) {
        try {
          wakeLock.release();
        } catch (e) {}
        wakeLock = null;
      }
      if (noSleepVideo) {
        try {
          noSleepVideo.pause();
        } catch (e) {}
      }
    }

    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        if (isSessionActive) {
          if ('wakeLock' in navigator && navigator.wakeLock && !wakeLock) {
            requestWakeLock();
          } else if (noSleepVideo && noSleepVideo.paused) {
            playNoSleepVideo();
          }
        }
        if (isSessionActive && (!ws || ws.readyState !== WebSocket.OPEN)) {
          if (currentStatusKey !== 'status_ended' && currentStatusKey !== 'status_rejected') {
            connect();
          }
        }
      }
    });

    // 큰 화면 보기 (?view=screen): 배치는 CSS(.view-screen)가 한다. 여기는 켜기·도구 막대 잠깐 보이기·전체화면뿐.
    const SCREEN_TOOLS_MS = 4000;
    const isScreenView = new URLSearchParams(location.search).get('view') === 'screen';
    if (isScreenView) {
      document.documentElement.classList.add('view-screen');
      btnToggleTts.classList.add('active');
      let toolsTimer = null;
      const showTools = () => {
        document.documentElement.classList.add('show-tools');

        toolsTimer = setTimeout(() => document.documentElement.classList.remove('show-tools'), SCREEN_TOOLS_MS);
      };
      ['pointerdown', 'pointermove', 'keydown'].forEach(ev => document.addEventListener(ev, showTools, { passive: true }));
      document.getElementById('btn-fullscreen').addEventListener('click', () => {
        try {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen();
        } catch (e) {}
      });
    }

    function normalizeLangCode(code) {
      if (!code) return '';
      const lower = code.toLowerCase();
      if (lower.startsWith('zh')) return 'zh';
      if (lower === 'tl' || lower.startsWith('tl-') || lower === 'fil' || lower.startsWith('fil-')) return 'fil';
      if (lower === 'in' || lower.startsWith('in-')) return 'id';
      if (lower === 'iw' || lower.startsWith('iw-')) return 'he';
      return lower.split('-')[0];
    }

    const RTL = new Set(['ar', 'he', 'iw', 'fa', 'ur']); // iw 는 he 의 옛 코드

    function t(key, lang = currentUiLang) {
      if (!uiStrings || !uiStrings.strings || !uiStrings.strings[key]) return '';
      const item = uiStrings.strings[key];
      return item[lang] || item['en'] || item['ko'] || '';
    }

    function getAvailableLangs() {
      return (uiStrings && uiStrings.langs) || ['ko', 'en'];
    }

    function determineLanguage() {
      const avail = getAvailableLangs();

      // 1. URL ?lang=
      const params = new URLSearchParams(location.search);
      const qLang = params.get('lang');
      if (qLang) {
        const norm = normalizeLangCode(qLang);
        if (avail.includes(norm)) return norm;
      }

      // 2. 사용자가 실제로 고른 적이 있는 저장된 값 (localStorage)
      const savedLang = localStorage.getItem('raytok_lang');
      if (savedLang) {
        const norm = normalizeLangCode(savedLang);
        if (avail.includes(norm)) return norm;
      }

      // 3. selectedLang(자막 언어)이 지정된 경우: 19개 UI 언어에 포함되면 해당 언어, 없으면(ar, fa 등) 영문(en) fallback
      if (selectedLang) {
        const norm = normalizeLangCode(selectedLang);
        if (avail.includes(norm)) return norm;
        return 'en';
      }

      // 4. navigator.language 앞 2자(zh-CN→zh, fil은 tl도 인정)
      const nav = (navigator.language || '').trim();
      if (nav) {
        const norm = normalizeLangCode(nav);
        if (avail.includes(norm)) return norm;
        const sub = nav.substring(0, 2).toLowerCase();
        const subNorm = normalizeLangCode(sub);
        if (avail.includes(subNorm)) return subNorm;
      }

      // 5. en
      return 'en';
    }

    function applyStrings(lang) {
      currentUiLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.setAttribute('dir', RTL.has(normalizeLangCode(lang)) ? 'rtl' : 'ltr');
      document.title = t('page_title', lang);

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key, lang);
        if (el.tagName === 'INPUT') {
          el.placeholder = val;
        } else {
          el.textContent = val;
        }
      });

      btnToggleTts.textContent = isTtsEnabled ? t('tts_on', lang) : t('tts_off', lang);
      if (currentStatusKey) {
        statusText.textContent = t(currentStatusKey, lang);
      }

      updateLangSelectOptions();
      if (isConnected) {
        updateCurrentLangText();
        renderAllLines();
      }
    }

    function updateLangSelectOptions() {
      if (!langs || langs.length === 0) return;
      const curVal = langSelect.value || selectedLang;
      langSelect.innerHTML = '';
      const isKo = currentUiLang === 'ko';
      langs.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.code;
        let name = isKo ? l.name_ko : l.name_en;
        if (!l.offline) name += t('lang_need_net', currentUiLang);
        opt.textContent = name;
        langSelect.appendChild(opt);
      });
      if (curVal && langs.some(l => l.code === curVal)) {
        langSelect.value = curVal;
      }
    }

    function updateCurrentLangText() {
      const isKo = currentUiLang === 'ko';
      const cur = langs.find(l => l.code === selectedLang);
      currentLangText.textContent = cur ? (isKo ? cur.name_ko : cur.name_en) : selectedLang;
    }

    function updateSubtitleDir() {
      const isRtl = RTL.has(normalizeLangCode(selectedLang));
      chatList.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    }

    function setStatus(key, dotClass) {
      currentStatusKey = key;
      statusText.textContent = t(key, currentUiLang);
      if (dotClass) statusDot.className = dotClass;
    }

    async function initApp() {
      try {
        const res = await fetch('./langs.json');
        if (res.ok) langs = await res.json();
      } catch (e) {}

      try {
        const res = await fetch('./ui-strings.json');
        if (res.ok) uiStrings = await res.json();
      } catch (e) {}

      const availableLangs = (uiStrings && uiStrings.langs) || ['ko', 'en'];

      const params = new URLSearchParams(location.search);
      const qLang = params.get('lang');
      const savedLang = localStorage.getItem('raytok_lang');

      // 1. 자막 언어(selectedLang) 먼저 결정
      if (qLang && langs.some(l => l.code === qLang)) {
        selectedLang = qLang;
      } else if (savedLang && langs.some(l => l.code === savedLang)) {
        selectedLang = savedLang;
      } else {
        const nav = (navigator.language || '').trim();
        const norm = normalizeLangCode(nav);
        const match = langs.find(l => l.code === nav || l.code === norm || l.code.startsWith(norm));
        if (match) selectedLang = match.code;
        else selectedLang = 'en';
      }

      // 2. langSelect.value = selectedLang (applyStrings 앞)
      if (selectedLang) langSelect.value = selectedLang;

      // 3. UI 언어 결정 및 적용 (selectedLang 기반)
      const initialUiLang = determineLanguage();
      applyStrings(initialUiLang);
      updateSubtitleDir();

      const qRoom = params.get('room');
      if (qRoom) {
        roomInput.value = qRoom.toUpperCase();
        if (params.get('auto') === '1') {
          setTimeout(() => btnJoin.click(), 500);
        }
      }
    }
    initApp();

    langSelect.addEventListener('change', () => {
      selectedLang = langSelect.value;
      localStorage.setItem('raytok_lang', selectedLang);

      const newUiLang = determineLanguage();
      applyStrings(newUiLang);
      updateSubtitleDir();

      if (isConnected) {
        sendHello();
        renderAllLines();
      }
    });

    // TTS 설정
    function updateVoice() {
      const voices = speechSynthesis.getVoices();
      currentVoice = voices.find(v => v.lang.startsWith(selectedLang)) || voices.find(v => v.lang.startsWith('en')) || voices[0];
    }
    speechSynthesis.onvoiceschanged = updateVoice;

    btnToggleTts.addEventListener('click', () => {
      isTtsEnabled = !isTtsEnabled;
      btnToggleTts.textContent = isTtsEnabled ? t('tts_on', currentUiLang) : t('tts_off', currentUiLang);
      btnToggleTts.classList.toggle('active', !isTtsEnabled);
    });

    // RULE P-03: speak only confirmed `tr`, never `pending`
    function speak(text, via, audioUrl) {
      if (!isTtsEnabled) return;
      speechSynthesis.cancel();

      if (audioUrl) {
        try {
          const audio = new Audio(audioUrl);
          audio.play().catch(e => {
            console.warn('[Audio play failed, fallback to speechSynthesis]:', e);
            speakWebTts(text, via);
          });
          return;
        } catch (_) {}
      }

      speakWebTts(text, via);
    }

    function speakWebTts(text, via) {
      if (!text) return;
      const uttr = new SpeechSynthesisUtterance(text);

      const voices = speechSynthesis.getVoices();

      let targetLang = selectedLang;
      if (via) targetLang = via;

      let voice = voices.find(v => v.lang.startsWith(targetLang));
      if (!voice && via) voice = voices.find(v => v.lang.startsWith(selectedLang));
      if (!voice) {
        const langObj = langs.find(l => l.code === selectedLang);
        if (langObj && langObj.fallback) {
          voice = voices.find(v => v.lang.startsWith(langObj.fallback));
        }
      }

      if (voice) {
        uttr.voice = voice;
        uttr.lang = voice.lang;
        speechSynthesis.speak(uttr);
      }
    }

    // 연결 관리
    function connect() {
      if (ws) ws.close();

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const params = new URLSearchParams(location.search);
      const wsPort = params.get('ws') || '8081';
      const relayHost = params.get('relay') || (location.port === '8788' ? `${location.hostname}:8787` : location.host);
      const wsUrl = params.get('ws') ? `ws://${location.hostname}:${wsPort}` : `${protocol}//${relayHost}/ws?room=${roomCode}&role=listener`;

      setStatus('status_connecting', 'status-dot reconnecting');

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        sendHello();
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handleMessage(msg);
      };

      ws.onclose = () => {
        isConnected = false;
        if (currentStatusKey !== 'status_ended' && currentStatusKey !== 'status_rejected') {
          setStatus('status_reconnecting', 'status-dot reconnecting');
          setTimeout(connect, 3000);
        }
      };
    }

    function sendHello() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const langObj = langs.find(l => l.code === selectedLang);
      const payload = {
        hello: 1,
        ver: LISTENER_VER,
        room: roomCode,
        lang: selectedLang,
        name: myName,
        deviceId: deviceId,
        caps: { tts: true, tr: false }
      };
      if (langObj && langObj.fallback) payload.fallbackLang = langObj.fallback;
      const last = localStorage.getItem(`raytok_last_seq_${roomCode}`);
      if (last) payload.resume_from = parseInt(last);

      ws.send(JSON.stringify(payload));
    }

    function handleMessage(msg) {
      if ('__ping' in msg) return;

      if ('welcome' in msg) {
        isConnected = true;
        srcLang = msg.src_lang || 'ko';
        setStatus('status_connected', 'status-dot online');
        joinScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        document.documentElement.classList.add('in-chat');
        updateCurrentLangText();
        return;
      }

      if ('bye' in msg) {
        releaseWake();
        setStatus('status_rejected', 'status-dot offline');
        ws.close();
        alert(t('alert_rejected', currentUiLang) + (msg.why || t('unknown_reason', currentUiLang)));
        return;
      }

      if ('end' in msg) {
        setStatus('status_ended', 'status-dot offline');
        ws.close();
        showEnd(msg.summary);
        return;
      }

      if (msg.pending && !msg.seq && 'text' in msg) {
        let pendingDiv = document.getElementById('msg-pending');
        if (!pendingDiv) {
          pendingDiv = document.createElement('div');
          pendingDiv.id = 'msg-pending';
          pendingDiv.className = 'msg-line';
          pendingDiv.innerHTML = `
            <div class="msg-bubble" style="border: 1px dashed var(--warning); opacity: 0.85;">
              <div class="msg-text" style="color: var(--text-muted); font-style: italic;"></div>
              <div class="msg-tr" style="font-size: 12px; color: var(--warning);"><span class="badge badge-pending">${t('badge_pending', currentUiLang)}</span></div>
            </div>
            <div class="msg-src" style="color: var(--warning);">[실시간 임시] ${srcLang.toUpperCase()}</div>
          `;
          chatList.appendChild(pendingDiv);
        }
        pendingDiv.querySelector('.msg-text').textContent = msg.text;
        chatList.scrollTop = chatList.scrollHeight;
        return;
      }

      if (msg.fix && msg.seq && msg.spk) {
        const line = lines.find(l => l.seq === msg.seq);
        if (line) {
          line.spk = msg.spk;
          const badge = document.getElementById(`spk-badge-${msg.seq}`);
          if (badge) {
            badge.className = `badge ${msg.spk === 'meeting' ? 'badge-meeting' : 'badge-me'}`;
            badge.textContent = msg.spk === 'meeting' ? '회의 (meeting)' : '나 (me)';
          }
        }
        return;
      }

      if ('text' in msg) {
        const pendingDiv = document.getElementById('msg-pending');
        if (pendingDiv) pendingDiv.remove();

        const line = {
          seq: msg.seq,
          text: msg.text,
          spk: msg.spk || 'meeting',
          tr: msg.tr || {},
          pending: !!msg.pending,
          via: msg.via
        };
        lines.push(line);
        lastSeq = msg.seq;
        localStorage.setItem(`raytok_last_seq_${roomCode}`, lastSeq);
        addLine(line);
        if (line.tr[selectedLang]) speak(line.tr[selectedLang], line.via, msg.audio_url || (msg.tr && msg.tr.audio_url));
      } else if ('tr' in msg && !('text' in msg)) {
        const line = lines.find(l => l.seq === msg.seq);
        if (line) {
          Object.assign(line.tr, msg.tr);
          line.pending = false;
          if (msg.via) line.via = msg.via;
          updateLineUI(line);
          if (msg.tr[selectedLang]) speak(msg.tr[selectedLang], line.via, msg.audio_url || (msg.tr && msg.tr.audio_url));
        }
      } else if ('no_tr' in msg) {
        const line = lines.find(l => l.seq === msg.seq);
        if (line) {
          line.pending = false;
          updateLineUI(line);
        }
      }
    }

    function addLine(line) {
      const div = document.createElement('div');
      div.className = 'msg-line';
      div.id = `msg-${line.seq}`;
      const spkClass = line.spk === 'meeting' ? 'badge-meeting' : 'badge-me';
      const spkLabel = line.spk === 'meeting' ? '회의 (meeting)' : '나 (me)';
      div.innerHTML = `
        <div class="msg-bubble">
          <div class="msg-text"></div>
          <div class="msg-tr"></div>
        </div>
        <div class="msg-src" dir="ltr">#${line.seq} ${srcLang.toUpperCase()} <span class="badge ${spkClass}" id="spk-badge-${line.seq}">${spkLabel}</span></div>
      `;
      const textDiv = div.querySelector('.msg-text');
      textDiv.textContent = line.text;
      textDiv.setAttribute('dir', RTL.has(normalizeLangCode(srcLang)) ? 'rtl' : 'ltr');
      chatList.appendChild(div);
      updateLineUI(line);
      chatList.scrollTop = chatList.scrollHeight;
    }

    function updateLineUI(line) {
      const div = document.getElementById(`msg-${line.seq}`);
      if (!div) return;
      const trDiv = div.querySelector('.msg-tr');

      trDiv.setAttribute('dir', RTL.has(normalizeLangCode(selectedLang)) ? 'rtl' : 'ltr');
      const trText = line.tr[selectedLang] || '';
      trDiv.textContent = trText;

      const voices = speechSynthesis.getVoices();
      let hasVoice = false;
      let targetLang = selectedLang;
      if (line.via) targetLang = line.via;

      let voice = voices.find(v => v.lang.startsWith(targetLang));
      if (!voice && line.via) voice = voices.find(v => v.lang.startsWith(selectedLang));
      if (!voice) {
        const langObj = langs.find(l => l.code === selectedLang);
        if (langObj && langObj.fallback) {
          voice = voices.find(v => v.lang.startsWith(langObj.fallback));
        }
      }
      if (voice) hasVoice = true;

      if (line.pending) {
        const badge = document.createElement('span');
        badge.className = 'badge badge-pending';
        badge.textContent = t('badge_pending', currentUiLang);
        trDiv.appendChild(badge);
      }

      if (line.via) {
        const viaLang = langs.find(l => l.code === line.via);
        const viaName = viaLang ? (currentUiLang === 'ko' ? viaLang.name_ko : viaLang.name_en) : line.via;
        const badge = document.createElement('span');
        badge.className = 'badge badge-via';
        badge.textContent = `${t('badge_via', currentUiLang)}(${viaName})`;
        trDiv.appendChild(badge);
      }

      if (trText && !hasVoice) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.style.backgroundColor = 'var(--danger)';
        badge.style.color = '#fff';
        badge.textContent = t('no_voice_badge', currentUiLang);
        trDiv.appendChild(badge);
      }
    }

    function renderAllLines() {
      chatList.innerHTML = '';
      lines.forEach(addLine);
      updateCurrentLangText();
      updateVoice();
    }

    function showEnd(summary) {
      releaseWake();
      const s = summary || {};
      document.getElementById('sum-lines').textContent = s.lines || lastSeq;
      document.getElementById('sum-minutes').textContent = s.minutes || 0;
      const joinedRow = document.getElementById('sum-joined-row');
      if (s.joined_max > 0) {
        document.getElementById('sum-joined').textContent = s.joined_max;
        joinedRow.style.display = 'block';
      } else {
        joinedRow.style.display = 'none';
      }
      applyStrings(currentUiLang);
      endModal.style.display = 'flex';
    }

    btnJoin.addEventListener('click', () => {
      try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch(e){}
      roomCode = roomInput.value.trim();
      myName = nameInput.value.trim();
      if (roomCode.length !== 6) {
        alert(t('alert_invalid_code', currentUiLang));
        return;
      }
      keepAwake();
      connect();
    });
  </script>
</body>
</html>
