<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RayTok Desk 기록 보관함</title>
  <link rel="icon" type="image/png" href="../../assets/favicon.png">
  <link rel="stylesheet" href="/common/theme.css">
  <style>
    :root {
      /* 줄 20 디자인 체계 동기화 */
      --font-xs: 11px;
      --font-sm: 13px;
      --font-md: 15px;
      --font-lg: 17px;
      --font-xl: 22px;
      --font-hero: 30px;
      --sp-xs: 4px;
      --sp-sm: 8px;
      --sp-md: 12px;
      --sp-lg: 16px;
      --sp-xl: 24px;
      --ink-high: #ffffff;
      --ink-mid: rgba(255, 255, 255, 0.5);
      --ink-low: rgba(255, 255, 255, 0.45);

      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
      --badge-bg: rgba(56, 189, 248, 0.15);
      --badge-text: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: var(--sp-xl) var(--sp-md);
    }
    .container { max-width: 800px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo-area { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo-area > div { min-width: 0; flex: 1; }
    .logo-area img { width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0; }
    h1 { font-size: 20px; font-weight: 700; overflow-wrap: break-word; }
    .sub-title { font-size: 13px; color: var(--text-muted); overflow-wrap: break-word; word-break: keep-all; }

    /* 토큰 입력 카드 */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: var(--sp-lg);
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text-muted); }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type="text"], input[type="password"] {
      flex: 1 1 140px;
      min-width: 0;
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: monospace;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: var(--primary); }
    .btn {
      background: var(--primary);
      color: #0f172a;
      border: none;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      max-width: 100%;
      white-space: nowrap;
    }
    @media (max-width: 360px) {
      .input-row .btn { width: 100%; }
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover { background: #475569; }

    /* 세션 목록 */
    .session-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-item:hover {
      border-color: var(--primary);
      background: var(--card-hover);
    }
    .session-meta { display: flex; flex-direction: column; gap: 4px; }
    .session-code { font-size: 16px; font-weight: 700; color: var(--primary); }
    .session-time { font-size: 13px; color: var(--text-muted); }
    .session-host { font-size: 12px; color: #64748b; }
    .session-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    /* 세션 상세 뷰 */
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .detail-actions { display: flex; gap: 8px; }
    .timeline {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      max-height: 560px;
      overflow-y: auto;
    }
    .msg-row {
      padding: 10px 0;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }
    .msg-row:last-child { border-bottom: none; }
    .msg-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .speaker-badge {
      background: rgba(148, 163, 184, 0.2);
      color: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .msg-src { font-size: 14px; color: #f8fafc; font-weight: 500; }
    .msg-tr { font-size: 13px; color: var(--primary); margin-top: 2px; }
    .msg-notice {
      font-size: 12px;
      color: #64748b;
      font-style: italic;
      text-align: center;
      padding: 6px 0;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-area">
        <img src="../../assets/favicon.png" alt="RayTok">
        <div>
          <h1>RayTok Desk 기록 보관함</h1>
          <div class="sub-title">종료된 회의 세션의 타임라인 및 해시 체인 무결성 확인</div>
        </div>
      </div>
    </header>

    <!-- 1. 이용권 인증 영역 -->
    <div class="card" id="view-auth">
      <div class="form-group">
        <label for="input-token">Desk 이용권 토큰 (0x08 권한)</label>
        <div class="input-row">
          <input type="text" id="input-token" placeholder="이용권 토큰을 입력하세요" autocomplete="off">
          <button class="btn" id="btn-auth">조회</button>
        </div>
      </div>
      <div id="auth-msg" style="font-size: 13px; color: var(--danger); display: none;"></div>
      <div style="font-size: 12px; color: var(--text-muted); margin-top: 10px; line-height: 1.4;">
        ※ 서버 준비 중이면 목록이 비어 보일 수 있습니다.
      </div>
    </div>

    <!-- 2. 세션 목록 영역 -->
    <div id="view-list" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h2 style="font-size: 16px; font-weight: 600;">보관된 세션 목록 (<span id="session-count">0</span>)</h2>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;" id="btn-logout">다른 이용권</button>
      </div>
      <div id="session-list"></div>
    </div>

    <!-- 3. 세션 상세 보기 영역 -->
    <div id="view-detail" class="hidden">
      <div class="detail-header">
        <button class="btn btn-secondary" id="btn-back">← 목록으로</button>
        <div class="detail-actions">
          <button class="btn btn-secondary" id="btn-download">JSON 내려받기</button>
          <button class="btn" id="btn-verify">검증</button>
          <button class="btn" style="background: var(--danger); color: #fff;" id="btn-delete">기록 삭제</button>
        </div>
      </div>

      <div class="card" style="margin-bottom: 16px; padding: 16px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
          <div>회의 코드: <b id="detail-code" style="color: var(--primary);">-</b></div>
          <div>호스트: <span id="detail-host" style="color: var(--text-muted);">-</span></div>
          <div>일시: <span id="detail-time" style="color: var(--text-muted);">-</span></div>
        </div>
      </div>

      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <footer style="margin-top: 36px; padding: 16px 0; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); text-align: center;">
    <div style="margin-bottom: 6px;">
      <a href="/privacy/" style="color: var(--text-muted); text-decoration: none; margin-right: 14px;">개인정보 처리방침</a>
      <a href="/web/terms/" style="color: var(--text-muted); text-decoration: none;">이용약관</a>
    </div>
    <p style="margin: 0; font-size: 12px; color: var(--text-muted);">주식회사 피엔엘에코 · 경기도 화성시 동탄대로 635, 1동 1507호 · 통신판매업 신고번호: [신고 준비 중] · 문의: <a href="mailto:raytok.dany@gmail.com" style="color: var(--text-muted);">raytok.dany@gmail.com</a></p>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const relayUrl = urlParams.get('relay') || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? window.location.origin : 'https://raytok-relay.raytok.workers.dev');

    const viewAuth = document.getElementById('view-auth');
    const inputToken = document.getElementById('input-token');
    const btnAuth = document.getElementById('btn-auth');
    const authMsg = document.getElementById('auth-msg');

    const viewList = document.getElementById('view-list');
    const sessionCount = document.getElementById('session-count');
    const sessionList = document.getElementById('session-list');
    const btnLogout = document.getElementById('btn-logout');

    const viewDetail = document.getElementById('view-detail');
    const btnBack = document.getElementById('btn-back');
    const btnDownload = document.getElementById('btn-download');
    const btnVerify = document.getElementById('btn-verify');
    const btnDelete = document.getElementById('btn-delete');
    const detailCode = document.getElementById('detail-code');
    const detailHost = document.getElementById('detail-host');
    const detailTime = document.getElementById('detail-time');
    const timeline = document.getElementById('timeline');

    let currentToken = '';
    let currentSessionData = null;
    let currentSessionId = null;
    let currentSessionList = [];

    btnAuth.addEventListener('click', () => loadSessions());
    inputToken.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadSessions(); });

    btnLogout.addEventListener('click', () => {
      currentToken = '';
      currentSessionId = null;
      inputToken.value = '';
      viewList.classList.add('hidden');
      viewDetail.classList.add('hidden');
      viewAuth.classList.remove('hidden');
    });

    btnBack.addEventListener('click', () => {
      currentSessionId = null;
      viewDetail.classList.add('hidden');
      viewList.classList.remove('hidden');
    });

    // 세션 목록 불러오기
    async function loadSessions() {
      const token = inputToken.value.trim();
      if (!token) {
        showAuthError('이용권 토큰을 입력해 주세요.');
        return;
      }
      authMsg.style.display = 'none';

      try {
        const res = await fetch(`${relayUrl}/desk/sessions`, {
          method: 'GET',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (!res.ok) {
          if (res.status === 403) throw new Error('이 토큰에는 Desk 세션 접근 권한(0x08)이 없습니다.');
          if (res.status === 401) throw new Error('유효하지 않거나 만료된 토큰입니다.');
          throw new Error('세션 목록을 불러올 수 없습니다. (' + res.status + ')');
        }

        const list = await res.json();
        currentToken = token;
        currentSessionList = Array.isArray(list) ? list : [];
        renderSessionList(currentSessionList);
        viewAuth.classList.add('hidden');
        viewList.classList.remove('hidden');
      } catch (err) {
        showAuthError(err.message);
      }
    }

    function showAuthError(msg) {
      authMsg.textContent = msg;
      authMsg.style.display = 'block';
    }

    function renderSessionList(list) {
      sessionCount.textContent = list.length;
      sessionList.innerHTML = '';

      if (list.length === 0) {
        sessionList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px;">보관된 Desk 세션이 없습니다.</div>';
        return;
      }

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'session-item';
        const d = item.started ? new Date(item.started).toLocaleString() : '-';
        div.innerHTML = `
          <div class="session-meta">
            <div class="session-code">회의 코드: ${escapeHtml(item.code || '-')}</div>
            <div class="session-time">${d}</div>
            <div class="session-host">호스트 기기: ${escapeHtml(item.host || '-')}</div>
          </div>
          <div class="session-badge">${item.count || 0} 개 항목</div>
        `;
        div.addEventListener('click', () => openSession(item.id));
        sessionList.appendChild(div);
      });
    }

    // 단건 세션 상세 불러오기
    async function openSession(id) {
      try {
        const res = await fetch(`${relayUrl}/desk/session/${encodeURIComponent(id)}`, {
          method: 'GET',
          headers: { 'Authorization': 'Bearer ' + currentToken }
        });

        if (!res.ok) {
          alert('세션 데이터를 불러오지 못했습니다: ' + res.status);
          return;
        }

        const data = await res.json();
        currentSessionData = data;
        currentSessionId = id;
        renderSessionDetail(data);

        viewList.classList.add('hidden');
        viewDetail.classList.remove('hidden');
      } catch (err) {
        alert('세션 로드 오류: ' + err.message);
      }
    }

    function renderSessionDetail(data) {
      const sess = data.session || {};
      detailCode.textContent = sess.code || '-';
      detailHost.textContent = sess.host || '-';
      detailTime.textContent = sess.started ? new Date(sess.started).toLocaleString() : '-';

      timeline.innerHTML = '';
      const items = data.items || [];

      items.forEach(it => {
        const row = document.createElement('div');
        row.className = 'msg-row';

        if (it.kind === 'line' || it.kind === 'tr' || it.kind === 'script') {
          const timeStr = it.ts ? new Date(it.ts).toLocaleTimeString() : '';
          const trText = (it.tr && typeof it.tr === 'object') ? Object.values(it.tr).join(' / ') : '';

          row.innerHTML = `
            <div class="msg-header">
              <span class="speaker-badge">${escapeHtml(it.kind)}</span>
              <span>${timeStr}</span>
            </div>
            <div class="msg-src">${escapeHtml(it.text || '')}</div>
            ${trText ? `<div class="msg-tr">🌐 ${escapeHtml(trText)}</div>` : ''}
          `;
        } else if (it.kind === 'join') {
          // 이름 가린 세션(name: "")은 익명 처리
          const nameDisplay = it.name ? escapeHtml(it.name) : '(익명)';
          row.className = 'msg-row msg-notice';
          row.textContent = `[참석] ${nameDisplay} (${it.lang || '?'}) 장치:${it.dev || ''}`;
        } else if (it.kind === 'leave') {
          row.className = 'msg-row msg-notice';
          row.textContent = `[퇴장] 장치:${it.dev || ''} (사유: ${it.why || 'normal'})`;
        } else if (it.kind === 'end') {
          row.className = 'msg-row msg-notice';
          row.textContent = `[회의 종료] 총 ${it.lines || 0} 줄, ${it.minutes || 0} 분`;
        } else {
          row.className = 'msg-row msg-notice';
          row.textContent = `[${it.kind}] n=${it.n}`;
        }

        timeline.appendChild(row);
      });
    }

    // JSON 내려받기
    btnDownload.addEventListener('click', () => {
      if (!currentSessionData) return;
      const jsonStr = JSON.stringify(currentSessionData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const filename = `raytok_session_${currentSessionData.session?.code || 'desk'}.json`;
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // 해시 체인 검증 연동 (web/verify)
    btnVerify.addEventListener('click', () => {
      if (!currentSessionData) return;
      try {
        sessionStorage.setItem('verify_payload', JSON.stringify(currentSessionData));
        window.location.href = '../verify/';
      } catch (e) {
        alert('검증 화면 이동 중 오류: ' + e.message);
      }
    });

    // 세션 영구 삭제 (DELETE /desk/session/:id)
    btnDelete.addEventListener('click', async () => {
      if (!currentSessionId || !currentToken) return;
      if (!confirm('이 회의 기록을 릴레이에서 영구 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.')) return;
      btnDelete.disabled = true;
      btnDelete.textContent = '삭제 중...';

      try {
        const res = await fetch(`${relayUrl}/desk/session/${encodeURIComponent(currentSessionId)}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + currentToken }
        });

        if (!res.ok) {
          throw new Error('삭제 실패 (상태: ' + res.status + ')');
        }

        alert('회의 기록이 영구 삭제되었습니다.');
        currentSessionList = currentSessionList.filter(s => s.id !== currentSessionId);
        currentSessionId = null;
        currentSessionData = null;
        renderSessionList(currentSessionList);
        viewDetail.classList.add('hidden');
        viewList.classList.remove('hidden');
      } catch (err) {
        alert(err.message);
      } finally {
        btnDelete.disabled = false;
        btnDelete.textContent = '기록 삭제';
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
